<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sakura Nihongo (桜日本語) | JFT-Basic & JLPT 2025-2026 Master Reviewer</title>
    
    <!-- Fast Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Non-blocking Asynchronous Font Loading with Fallback -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap"
      media="print"
      onload="this.media='all'"
    >
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap">
    </noscript>

    <style>
      /* Fallback Instant Typography while Google Fonts loads */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", "Yu Gothic", sans-serif;
      }
      @keyframes sakuraPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      .initial-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #fdfbf7;
        color: #881337;
        text-align: center;
        padding: 20px;
      }
      .loader-icon {
        font-size: 54px;
        margin-bottom: 16px;
        animation: sakuraPulse 1.6s ease-in-out infinite;
      }
      .loader-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
        color: #1e1b4b;
      }
      .loader-sub {
        font-size: 13px;
        color: #e11d48;
        font-weight: 600;
      }
    </style>
  </head>
  <body class="bg-washi-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen selection:bg-sakura-200 selection:text-sakura-900 transition-colors duration-300">
    <div id="root">
      <div class="initial-loader">
        <div class="loader-icon">🌸</div>
        <div class="loader-title">Sakura Nihongo (桜日本語)</div>
        <div class="loader-sub">Opening Japanese Study Garden...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
